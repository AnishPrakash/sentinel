version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# SENTINEL — AI-Powered Cyber Threat Intelligence
# PS28 | VITISH 2026 | Smart India Hackathon
#
# Services:
#   backend   — FastAPI (Python) — Layers 1-5 pipeline
#   frontend  — React + Vite — SOC Dashboard
#   neo4j     — Provenance graph database (optional, falls back to NetworkX)
#   ollama    — Local LLM runtime (Llama 3.1 8B)
#   chromadb  — Vector store for MITRE ATT&CK RAG
#
# Usage:
#   docker compose up                     # start all services
#   docker compose up backend frontend    # skip neo4j + ollama (use in-memory)
#   docker compose --profile gpu up       # enable GPU for Ollama
# ─────────────────────────────────────────────────────────────────────────────

networks:
  sentinel_net:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  ollama_models:
  chroma_db:
  beth_data:

services:

  # ───────────────────────────────────────────────────────────────────────────
  # Neo4j — Provenance Graph Database
  # Community Edition, no license required
  # ───────────────────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.19-community
    container_name: sentinel_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol (py2neo connects here)
    environment:
      NEO4J_AUTH: "neo4j/sentinel_pass"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "1G"
      NEO4J_dbms_memory_pagecache_size: "512m"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - sentinel_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ───────────────────────────────────────────────────────────────────────────
  # ChromaDB — Vector Store for MITRE ATT&CK RAG
  # Persistent client mode — data survives container restarts
  # ───────────────────────────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.5.0
    container_name: sentinel_chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"   # ChromaDB HTTP API (internal port 8000, mapped to 8001 to avoid clash)
    environment:
      CHROMA_SERVER_HOST: "0.0.0.0"
      CHROMA_SERVER_HTTP_PORT: "8000"
      PERSIST_DIRECTORY: "/chroma/chroma_db"
      ANONYMIZED_TELEMETRY: "false"
    volumes:
      - chroma_db:/chroma/chroma_db
    networks:
      - sentinel_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ───────────────────────────────────────────────────────────────────────────
  # Ollama — Local LLM Runtime (Llama 3.1 8B)
  # CPU-only by default. Enable GPU profile below for near-instant inference.
  # First run: `docker compose exec ollama ollama pull llama3.1:8b`
  # ───────────────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: sentinel_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - sentinel_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    # ── GPU profile (uncomment or run with --profile gpu) ───────────────────
    # profiles:
    #   - gpu
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ───────────────────────────────────────────────────────────────────────────
  # Backend — FastAPI (All 5 Pipeline Layers)
  # ───────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # ── Risk Score Weights ──────────────────────────────────────────────
      ALPHA: "0.4"
      BETA: "0.3"
      GAMMA: "0.2"
      DELTA: "0.1"

      # ── GNN Settings ────────────────────────────────────────────────────
      GNN_THRESHOLD: "0.65"
      MODEL_WEIGHTS: "/app/layer2_gnn/weights/rgcn_sentinel.pt"

      # ── LLM / RAG Settings ──────────────────────────────────────────────
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "llama3.1:8b"
      CHROMA_PATH: "/app/chroma_db"
      MITRE_JSON: "/app/data/enterprise-attack.json"
      TOP_K: "5"

      # ── Demo Mode ───────────────────────────────────────────────────────
      # Set to "false" on demo day only if Ollama is fast enough
      DEMO_MODE: "true"
      DEMO_CACHE: "/app/data/demo_cache"

      # ── Graph / Data Paths ───────────────────────────────────────────────
      TOPOLOGY_JSON: "/app/data/topology.json"
      ASSET_JSON: "/app/data/asset_criticality.json"
      PLAYBOOK_DIR: "/app/data/playbooks"
      BETH_CSV: "/app/data/beth_dataset.csv"

      # ── Neo4j (optional — set USE_NEO4J=false to use NetworkX in-memory) ─
      USE_NEO4J: "false"
      NEO4J_URL: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "sentinel_pass"
    volumes:
      - ./backend:/app
      - chroma_db:/app/chroma_db
      - beth_data:/app/data/beth
    networks:
      - sentinel_net
    depends_on:
      ollama:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ───────────────────────────────────────────────────────────────────────────
  # Frontend — React + Vite (SOC Dashboard)
  # ───────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: "http://localhost:8000"
      VITE_GRAPH_POLL_MS: "3000"
      VITE_ALERTS_POLL_MS: "5000"
    networks:
      - sentinel_net
    depends_on:
      backend:
        condition: service_healthy

  # ───────────────────────────────────────────────────────────────────────────
  # Ollama Model Puller — one-shot init container
  # Pulls Llama 3.1 8B on first startup so backend never hits a cold miss
  # ───────────────────────────────────────────────────────────────────────────
  ollama_pull:
    image: ollama/ollama:latest
    container_name: sentinel_ollama_pull
    entrypoint: >
      sh -c "
        echo '[OllamaPull] Waiting for Ollama to be ready...';
        until curl -sf http://ollama:11434/api/tags; do sleep 5; done;
        echo '[OllamaPull] Pulling llama3.1:8b...';
        ollama pull llama3.1:8b;
        echo '[OllamaPull] Done.';
      "
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - sentinel_net
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"   # run once only

  # ───────────────────────────────────────────────────────────────────────────
  # ChromaDB Seeder — one-shot init container
  # Seeds MITRE ATT&CK techniques into ChromaDB on first run
  # ───────────────────────────────────────────────────────────────────────────
  chromadb_seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel_chromadb_seed
    entrypoint: >
      sh -c "
        echo '[Seed] Waiting for ChromaDB...';
        until curl -sf http://chromadb:8000/api/v1/heartbeat; do sleep 5; done;
        echo '[Seed] Seeding MITRE ATT&CK into ChromaDB...';
        python scripts/seed_chromadb.py;
        echo '[Seed] Done.';
      "
    environment:
      CHROMA_PATH: "http://chromadb:8000"
      MITRE_JSON: "/app/data/enterprise-attack.json"
    volumes:
      - ./backend:/app
    networks:
      - sentinel_net
    depends_on:
      chromadb:
        condition: service_healthy
    restart: "no"   # run once only